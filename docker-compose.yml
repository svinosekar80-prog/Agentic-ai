services:
  postgres:
    image: postgres:16
    container_name: ai-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_learning_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_learning_pgdata:/var/lib/postgresql/data
volumes:
  ai_learning_pgdata:
